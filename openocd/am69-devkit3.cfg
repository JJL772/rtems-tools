# For use with Toradex AM69 SoM devkit 3, though it should work with the other devkits

adapter driver ftdi
adapter usb vid_pid 0x0403 0x6011
gdb port 5500

# Channel 1 is connected to JTAG
ftdi channel 1
ftdi layout_init 0x0008 0x000b
ftdi layout_signal nTRST -data 0x0010 -oe 0x0010
ftdi layout_signal nSRST -data 0x0020 -oe 0x0020
transport select jtag

set SOC j784s4
source [find target/ti/k3.cfg]

adapter speed 2500
