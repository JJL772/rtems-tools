# EEPROM config for the FT4232H chip on the Aquila dev board that provides serial console and JTAG access.

vendor_id=0x0403      # FT4232H VID
product_id=0x6011     # FT4232H PID

max_power=500 # 0 for self powered?

manufacturer="Toradex"
product="Aquila JTAG Debugger"
serial="123456"

# Backup for the current EEPROM
filename="aquila_eeprom.bin"

# VCP = "virtual COM port". Must be disabled to use that channel as a JTAG w/OpenOCD
# Ch0 = reset lines
# Ch1 = JTAG
# Ch2/3 = serial consoles
cha_vcp=false
chb_vcp=false
chc_vcp=true
chd_vcp=true
